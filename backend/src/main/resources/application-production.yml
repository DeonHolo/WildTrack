server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
        name: WILDTRACK_UI_SESSION
        path: /
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

spring:
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${WILDTRACK_DB_MAX_POOL_SIZE:10}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

capvault:
  cors:
    allowed-origins: ${CAPVAULT_CORS_ALLOWED_ORIGINS:https://wildtrack.dev,https://www.wildtrack.dev}

wildtrack:
  google:
    identity:
      enabled: true
      client-id: ${WILDTRACK_GOOGLE_CLIENT_ID:}
  staff:
    bootstrap:
      assignments: ${WILDTRACK_STAFF_BOOTSTRAP_ASSIGNMENTS:}
  session:
    secure-cookie: true
